# ============================================================================
# dsh-minimax-web-api —— 把 minimax2api（minimaxcode2api）反代接入模型选择器
# ============================================================================
# 注意：仅作为 provider 路由接入模型选择器，不加入工具列表。
#
# 本文件是**本插件自带的 bundle patch**（package.json 的
# dsh.bundle.patch 指向它）。它随插件一起被 DSH 读取：
#
#   · 启用/停用 = profile 的 dsh.profile.bundles 里有没有 dsh-minimax-web-api
#     （插件页「已安装插件」右侧的开关改的就是那个列表）；
#   · 本文件里的 config 是插件的**可移植默认值**。profile 的
#     cordis.patch.yml 可以按 id 覆盖它（覆盖是整块替换，必须列全所有键）。
#
# 接入步骤：
#   1. 执行 .\install.ps1（把本机后端目录与 Python 解释器写进指针
#      ~/.dsh/minimax2api.json，并校验 node_modules 下是 junction）
#   2. 确认 profile 的 dsh.profile.bundles 里列了 dsh-minimax-web-api
#      （dsh plugin --profile desktop add link:<本目录> 会自动加）
#   3. 重启 DeepSeek Harness.exe
#
# 停用本插件不会留下悬空的 provider 行：整段 insert 随 bundle 一起退出组合。
# ============================================================================

- insert:
    - id: dsh-minimax-web-api-provider
      name: dsh-minimax-web-api/provider
      config:
        # 只允许回环：这个后端**完全没有鉴权**（控制台与 /v1 都开放），
        # 绑到 0.0.0.0 等于把号池和上游额度交给整个网络。
        baseUrl: 'http://127.0.0.1:4555'
        # 后端目录故意留空——解析顺序：配置 serverDir → 环境变量 DSH_MINIMAX2API_DIR
        # → 指针 ~/.dsh/minimax2api.json（install.ps1 写）→ 插件同级 → home 常见位置。
        # 需要指明时写绝对路径或 ~ 开头的路径：
        # serverDir: '~/DeepSeek_Harness/git-repo/minimax2api'
        # Python 解释器同理：配置 pythonPath → 环境变量 DSH_MINIMAX2API_PYTHON
        # → 后端目录下的 .venv → PATH。通常留空即可，install.ps1 会建好 .venv。
        # pythonPath: '~/DeepSeek_Harness/git-repo/minimax2api/.venv/Scripts/python.exe'
        # SQLite 与生成媒体的目录；留空 = <后端目录>/data。
        # dataDir: '~/.dsh/minimax2api-data'
        autoStart: true
        startTimeoutMs: 90000
        # M3.1 Flash 标称 512K（可选 1M）。申报 512K 让内核的压缩线有依据。
        maxContextWindow: 512000
        # Anthropic Messages 的 max_tokens 是必填项，反代缺省只有 4096；
        # 这个值既向 DSH 申报单轮输出预留，也作为 max_tokens 传给后端。
        defaultMaxTokens: 32768
        # 0 = 不裁剪工具描述；>0 时按字符预算裁剪并加省略号。
        toolDescriptionMaxChars: 0
        # /health 结果缓存：一次多步会话不必每步都探活一次。0 = 每次都探活。
        healthTtlMs: 30000
        # 上游连续无数据的容忍上限，超时按可重试的 TIMEOUT 中止。0 = 不设上限。
        # MiniMax 首个 token（尤其思考变体）可能很慢，给到 180s。
        streamIdleTimeoutMs: 180000
        # 单张图片发给上游的字节上限（base64 之前）。内核的 attachment 服务按这个
        # 目标挑最接近的压缩档：图片大了就降质，而不是原样发几 MB 上去。
        maxRequestImageBytes: 4194304
        # 后端子进程输出落盘（超过 2MB 轮转 .1），便于事后取证；留空只留在内存尾部 200 行。
        logFile: '~/.dsh/logs/minimax-web-api.log'
        # 托管（默认）：stdio 走管道，插件可 tail 日志并在 dispose 时按进程树回收；
        # 副作用是拉起者被强杀时后端会因管道断裂自行退出。detach: true 则相反。
        detach: false
        killTreeOnDispose: true
        # 子进程环境默认白名单（OS 必需项 + 代理变量 + MINIMAX2API_*）。
        # 还要透传别的变量（例如自定义证书路径）时在这里点名变量名。
        passEnvKeys: []
        # 直接注入后端的环境变量；MINIMAX2API_* 命名空间已默认放行，一般不用动。
        env: {}
        # 最小契约：/health 必须返回带 status 的 JSON（用于识别"这个端口上是不是本反代"）。
        # 号池为空只告警不拒用——那是运行状态，不是契约失败。
        strictBackend: true
        requiredCapabilities: []
        minBackendVersion: ''
        # 每日积分（签到）：插件随 DSH 客户端加载，客户端开着就保证当天领到。
        # 另有 Windows 计划任务（每天 09:05）作为第二道保险，两者跑同一个脚本。
        dailyCredits: true
        # token 续期：MiniMax 的 access token 只有 1 小时有效期，过期就是 401，
        # 而后端自带 keepalive 有"续期成功但账号仍被退休、且没有快速恢复"的洞。
        # 这里自己按间隔续期，并把被退休的账号复位。关掉就只剩后端的 keepalive。
        renewTokens: true
        # 复查间隔：30 分钟（token 有效期 1 小时，脚本内部按剩余 ≤20 分钟才续）。
        # 0 = 只在插件启动时跑一次。
        poolIntervalMs: 1800000
        # 领取状态文件（记每天的结果，避免同一天重复跑）。
        creditStateFile: '~/.dsh/minimax-web-api/claim-state.json'